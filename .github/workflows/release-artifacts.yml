name: Release Artifacts

run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name || 'Release Artifacts' }}

on:
  release:
    types:
      - published
      - prereleased
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Git tag / release tag to build and attach artifacts for
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-artifacts-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  WORKER_URL: https://mesh-utility.org/api
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # TODO: Re-enable macOS and iOS artifact jobs here once platform
  # packaging/signing paths are stable. Keep release artifacts under this
  # single workflow trigger.
  # Windows is not a supported download as of Alpha-18. The job below may
  # fail; publish does not require it. Do not document a Windows zip as
  # available unless that job is actually shipping.
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      # versionName is the pubspec name (1.0.0-alpha.N), not the Alpha-N tag.
      # versionCode is the pubspec build number, or N parsed from an Alpha-N tag.
      - name: Derive version from pubspec
        run: |
          PUBSPEC_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 || true)
          PUBSPEC_VERSION=$(printf '%s' "$PUBSPEC_VERSION" | tr -d '\r' | sed "s/[[:space:]]*#.*//; s/^[\"']//; s/[\"'][[:space:]]*$//; s/[[:space:]]*$//")
          BUILD_NAME="${PUBSPEC_VERSION%%+*}"
          BUILD_NUMBER=""
          if [ "$PUBSPEC_VERSION" != "$BUILD_NAME" ]; then
            BUILD_NUMBER=$(printf '%s' "${PUBSPEC_VERSION#*+}" | sed -n 's/^\([0-9][0-9]*\).*/\1/p')
          fi
          if [ -z "$BUILD_NUMBER" ]; then
            TAG_BODY="${RELEASE_TAG#v}"
            BUILD_NUMBER=$(printf '%s' "$TAG_BODY" | tr '[:upper:]' '[:lower:]' | sed -n 's/.*alpha[^0-9]*\([0-9][0-9]*\).*/\1/p')
          fi
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER=$(printf '%s' "$BUILD_NAME" | tr '[:upper:]' '[:lower:]' | sed -n 's/.*alpha[^0-9]*\([0-9][0-9]*\).*/\1/p')
          fi
          if [ -z "$BUILD_NAME" ] || [ -z "$BUILD_NUMBER" ]; then
            echo "Could not derive versionName and versionCode from pubspec '${PUBSPEC_VERSION}' and tag '${RELEASE_TAG}'." >&2
            exit 1
          fi
          echo "BUILD_NAME=${BUILD_NAME}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "versionName=${BUILD_NAME} versionCode=${BUILD_NUMBER}"

      - name: Setup Java 17 (Gradle 8.14 can't run on runner default JDK 25)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; release APK will use debug signing."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Build Android APK (release)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" --dart-define=WORKER_URL=$WORKER_URL --dart-define=APP_VERSION="${BUILD_NAME}+${BUILD_NUMBER}"

      - name: Fail if APK versionCode is 1
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "Release APK not found at ${APK}." >&2
            exit 1
          fi
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-${ANDROID_SDK_HOME:-}}}"
          if [ -z "$SDK" ] && [ -f android/local.properties ]; then
            SDK=$(sed -n 's/^sdk\.dir=//p' android/local.properties | head -n1 || true)
            SDK=$(printf '%s' "$SDK" | tr -d '\r' | sed 's/\\:/:/g; s/\\\\/\\/g')
          fi
          BADGING=""
          if command -v apkanalyzer >/dev/null 2>&1; then
            BADGING=$(apkanalyzer dump badging "$APK" 2>/dev/null || true)
          fi
          if ! printf '%s\n' "$BADGING" | grep -q "versionCode="; then
            AAPT2=""
            if [ -n "$SDK" ] && [ -d "$SDK/build-tools" ]; then
              AAPT2=$(find "$SDK/build-tools" -type f -name aapt2 | sort | tail -n1)
            fi
            if [ -z "$AAPT2" ]; then
              echo "aapt2/apkanalyzer dump badging could not run (no apkanalyzer badging output and no aapt2 under the Android SDK)." >&2
              exit 1
            fi
            BADGING=$("$AAPT2" dump badging "$APK")
          fi
          printf '%s\n' "$BADGING" | grep '^package:' || true
          CODE=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode=['\"]\\([0-9][0-9]*\\)['\"].*/\\1/p" | head -n1 || true)
          NAME=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName=['\"]\\([^'\"]*\\)['\"].*/\\1/p" | head -n1 || true)
          echo "APK versionCode=${CODE:-missing} versionName=${NAME:-missing} (expected versionCode=${BUILD_NUMBER} versionName=${BUILD_NAME})"
          if [ -z "$CODE" ] || [ "$CODE" -le 1 ]; then
            echo "APK versionCode must be greater than 1 (pubspec build number or Alpha-N). Got '${CODE:-missing}'." >&2
            exit 1
          fi

      - name: Stage release artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/mesh-utility-${RELEASE_TAG}-android.apk"

      - name: Upload staged artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      # versionName is the pubspec name (1.0.0-alpha.N), not the Alpha-N tag.
      # versionCode is the pubspec build number, or N parsed from an Alpha-N tag.
      - name: Derive version from pubspec
        run: |
          PUBSPEC_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 || true)
          PUBSPEC_VERSION=$(printf '%s' "$PUBSPEC_VERSION" | tr -d '\r' | sed "s/[[:space:]]*#.*//; s/^[\"']//; s/[\"'][[:space:]]*$//; s/[[:space:]]*$//")
          BUILD_NAME="${PUBSPEC_VERSION%%+*}"
          BUILD_NUMBER=""
          if [ "$PUBSPEC_VERSION" != "$BUILD_NAME" ]; then
            BUILD_NUMBER=$(printf '%s' "${PUBSPEC_VERSION#*+}" | sed -n 's/^\([0-9][0-9]*\).*/\1/p')
          fi
          if [ -z "$BUILD_NUMBER" ]; then
            TAG_BODY="${RELEASE_TAG#v}"
            BUILD_NUMBER=$(printf '%s' "$TAG_BODY" | tr '[:upper:]' '[:lower:]' | sed -n 's/.*alpha[^0-9]*\([0-9][0-9]*\).*/\1/p')
          fi
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER=$(printf '%s' "$BUILD_NAME" | tr '[:upper:]' '[:lower:]' | sed -n 's/.*alpha[^0-9]*\([0-9][0-9]*\).*/\1/p')
          fi
          if [ -z "$BUILD_NAME" ] || [ -z "$BUILD_NUMBER" ]; then
            echo "Could not derive versionName and versionCode from pubspec '${PUBSPEC_VERSION}' and tag '${RELEASE_TAG}'." >&2
            exit 1
          fi
          echo "BUILD_NAME=${BUILD_NAME}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "versionName=${BUILD_NAME} versionCode=${BUILD_NUMBER}"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Linux (release)
        run: flutter build linux --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" --dart-define=WORKER_URL=$WORKER_URL --dart-define=APP_VERSION="${BUILD_NAME}+${BUILD_NUMBER}"

      - name: Stage release artifact
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf \
            "dist/mesh-utility-${RELEASE_TAG}-linux-x64.tar.gz" .

      - name: Upload staged artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      # versionName is the pubspec name (1.0.0-alpha.N), not the Alpha-N tag.
      # versionCode is the pubspec build number, or N parsed from an Alpha-N tag.
      - name: Derive version from pubspec
        shell: bash
        run: |
          PUBSPEC_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 || true)
          PUBSPEC_VERSION=$(printf '%s' "$PUBSPEC_VERSION" | tr -d '\r' | sed "s/[[:space:]]*#.*//; s/^[\"']//; s/[\"'][[:space:]]*$//; s/[[:space:]]*$//")
          BUILD_NAME="${PUBSPEC_VERSION%%+*}"
          BUILD_NUMBER=""
          if [ "$PUBSPEC_VERSION" != "$BUILD_NAME" ]; then
            BUILD_NUMBER=$(printf '%s' "${PUBSPEC_VERSION#*+}" | sed -n 's/^\([0-9][0-9]*\).*/\1/p')
          fi
          if [ -z "$BUILD_NUMBER" ]; then
            TAG_BODY="${RELEASE_TAG#v}"
            BUILD_NUMBER=$(printf '%s' "$TAG_BODY" | tr '[:upper:]' '[:lower:]' | sed -n 's/.*alpha[^0-9]*\([0-9][0-9]*\).*/\1/p')
          fi
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER=$(printf '%s' "$BUILD_NAME" | tr '[:upper:]' '[:lower:]' | sed -n 's/.*alpha[^0-9]*\([0-9][0-9]*\).*/\1/p')
          fi
          if [ -z "$BUILD_NAME" ] || [ -z "$BUILD_NUMBER" ]; then
            echo "Could not derive versionName and versionCode from pubspec '${PUBSPEC_VERSION}' and tag '${RELEASE_TAG}'." >&2
            exit 1
          fi
          echo "BUILD_NAME=${BUILD_NAME}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "versionName=${BUILD_NAME} versionCode=${BUILD_NUMBER}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Windows (release)
        # bash so $WORKER_URL / $BUILD_NAME expand (default pwsh would not).
        shell: bash
        run: flutter build windows --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" --dart-define=WORKER_URL=$WORKER_URL --dart-define=APP_VERSION="${BUILD_NAME}+${BUILD_NUMBER}"

      - name: Stage release artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "dist/mesh-utility-${env:RELEASE_TAG}-windows-x64.zip"

      - name: Upload staged artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-web:
    name: Build Web (verification only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # versionName is the pubspec name (1.0.0-alpha.N), not the Alpha-N tag.
      # versionCode is the pubspec build number, or N parsed from an Alpha-N tag.
      - name: Derive version from pubspec
        run: |
          PUBSPEC_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1 || true)
          PUBSPEC_VERSION=$(printf '%s' "$PUBSPEC_VERSION" | tr -d '\r' | sed "s/[[:space:]]*#.*//; s/^[\"']//; s/[\"'][[:space:]]*$//; s/[[:space:]]*$//")
          BUILD_NAME="${PUBSPEC_VERSION%%+*}"
          BUILD_NUMBER=""
          if [ "$PUBSPEC_VERSION" != "$BUILD_NAME" ]; then
            BUILD_NUMBER=$(printf '%s' "${PUBSPEC_VERSION#*+}" | sed -n 's/^\([0-9][0-9]*\).*/\1/p')
          fi
          if [ -z "$BUILD_NUMBER" ]; then
            TAG_BODY="${RELEASE_TAG#v}"
            BUILD_NUMBER=$(printf '%s' "$TAG_BODY" | tr '[:upper:]' '[:lower:]' | sed -n 's/.*alpha[^0-9]*\([0-9][0-9]*\).*/\1/p')
          fi
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER=$(printf '%s' "$BUILD_NAME" | tr '[:upper:]' '[:lower:]' | sed -n 's/.*alpha[^0-9]*\([0-9][0-9]*\).*/\1/p')
          fi
          if [ -z "$BUILD_NAME" ] || [ -z "$BUILD_NUMBER" ]; then
            echo "Could not derive versionName and versionCode from pubspec '${PUBSPEC_VERSION}' and tag '${RELEASE_TAG}'." >&2
            exit 1
          fi
          echo "BUILD_NAME=${BUILD_NAME}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "versionName=${BUILD_NAME} versionCode=${BUILD_NUMBER}"

      - name: Build Web (release)
        run: flutter build web --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" --dart-define=WORKER_URL=$WORKER_URL --dart-define=APP_VERSION="${BUILD_NAME}+${BUILD_NUMBER}"

  publish-release-assets:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-linux
      - build-windows
      - build-web
    # Publish whatever built, as long as Android succeeded.
    # Windows can fail and is not a current download; a missing Windows zip is expected.
    if: ${{ !cancelled() && needs.build-android.result == 'success' }}
    steps:
      - name: Download staged artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*

  # Runs only after assets are attached. Windows can fail the workflow and
  # this job still runs, because it needs publish-release-assets, not the
  # Windows job. A failed verify skips the post and does not fail the workflow.
  announce-discord:
    name: Announce on Discord
    needs: [publish-release-assets]
    if: ${{ !cancelled() && needs.publish-release-assets.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify APK asset and announce
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "No release tag; skipping Discord announcement."
            exit 0
          fi
          tag_path=$(printf '%s' "$TAG" | jq -sRr @uri)
          set +e
          release_json=$(gh api "/repos/${REPO}/releases/tags/${tag_path}" 2>/tmp/gh-release-err)
          gh_status=$?
          set -e
          rm -f /tmp/gh-release-err
          if [ "$gh_status" -ne 0 ] || [ -z "$release_json" ]; then
            echo "Could not read GitHub release ${TAG}; skipping Discord announcement."
            exit 0
          fi
          draft=$(printf '%s' "$release_json" | jq -r '.draft')
          prerelease=$(printf '%s' "$release_json" | jq -r '.prerelease')
          if [ "$draft" = "true" ] || [ "$prerelease" = "true" ]; then
            echo "Release ${TAG} is draft or prerelease; skipping Discord announcement."
            exit 0
          fi
          apk_name=$(printf '%s' "$release_json" | jq -r '[.assets[]?.name | select(startswith("mesh-utility-") and endswith("-android.apk"))] | first // empty')
          if [ -z "$apk_name" ]; then
            echo "Android APK asset not attached for ${TAG}; skipping Discord announcement."
            exit 0
          fi
          echo "Found Android APK asset: ${apk_name}"
          if [ -z "${WEBHOOK:-}" ]; then
            echo "DISCORD_RELEASE_WEBHOOK not set; skipping."
            exit 0
          fi
          NAME=$(printf '%s' "$release_json" | jq -r '.name // empty')
          URL=$(printf '%s' "$release_json" | jq -r '.html_url // empty')
          BODY=$(printf '%s' "$release_json" | jq -r '.body // empty')
          notes=$(printf '%s' "$BODY" | head -c 3000)
          if [ "${#BODY}" -gt 3000 ]; then
            notes="${notes}"$'\n\n…full notes on GitHub.'
          fi
          apk="https://github.com/${REPO}/releases/download/${TAG}/mesh-utility-${TAG}-android.apk"
          payload=$(jq -n \
            --arg title "Mesh Utility ${NAME:-$TAG} is out" \
            --arg url "$URL" \
            --arg desc "$notes" \
            --arg apk "$apk" \
            --arg rel "$URL" \
            '{username:"Mesh Utility", allowed_mentions:{parse:[]},
              embeds:[{title:$title, url:$url, description:$desc, color:5763719,
                fields:[{name:"Download", value:("[Android APK](" + $apk + ") · [All downloads](" + $rel + ")")}]}]}')
          set +e
          http_code=$(curl -sS -o /tmp/discord-announce-body -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data-binary "$payload" \
            --url "$WEBHOOK" 2>/tmp/discord-announce-err)
          curl_status=$?
          set -e
          rm -f /tmp/discord-announce-body /tmp/discord-announce-err
          case "${http_code:-}" in
            200|201|202|204)
              echo "Announced ${TAG}"
              ;;
            *)
              echo "Discord webhook request failed (HTTP ${http_code:-none}, curl ${curl_status})."
              exit 1
              ;;
          esac
