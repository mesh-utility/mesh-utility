name: Deploy

# Deploys only when a full release is published (not on pushes to main).
# Manual runs are still possible from the Actions tab.
on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_PROJECT: mesh-utility-tracker
  PAGES_BRANCH: mesh-utility
  WORKER_URL: https://mesh-utility.org/api
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install worker dependencies
        run: npm ci
        working-directory: worker

      # Alpha-25 ships Pages only. Live Worker fca1aee8-2427-4d2a-b1ea-31cf1704b5de
      # already holds the server changes. Do not redeploy the Worker until a later
      # release is explicitly approved to ship Worker code.
      - name: Deploy Cloudflare Worker
        if: false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
        working-directory: worker

      - name: Build Flutter web
        run: |
          flutter pub get
          WORKER_URL="$WORKER_URL" ./tool/build_web_cloudflare.sh

      - name: Deploy Cloudflare Pages (production branch)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy build/web --project-name "$PAGES_PROJECT" --branch "$PAGES_BRANCH"
