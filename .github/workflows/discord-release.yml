name: Announce Release on Discord

# Posts a short announcement to the project Discord when a full release is
# published. Prereleases and drafts are skipped. Webhook URL lives in the
# DISCORD_RELEASE_WEBHOOK repository secret. To turn off, delete this file
# or the secret.
on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  announce:
    name: Post to Discord
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Send announcement
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ github.event.release.tag_name }}
          NAME: ${{ github.event.release.name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_RELEASE_WEBHOOK not set; skipping."
            exit 0
          fi
          notes="$(printf '%s' "$BODY" | head -c 3000)"
          if [ "${#BODY}" -gt 3000 ]; then notes="$notes"$'\n\n…full notes on GitHub.'; fi
          apk="https://github.com/$REPO/releases/download/$TAG/mesh-utility-$TAG-android.apk"
          payload="$(jq -n \
            --arg title "Mesh Utility ${NAME:-$TAG} is out" \
            --arg url "$URL" \
            --arg desc "$notes" \
            --arg apk "$apk" \
            --arg rel "$URL" \
            '{username:"Mesh Utility", allowed_mentions:{parse:[]},
              embeds:[{title:$title, url:$url, description:$desc, color:5763719,
                fields:[{name:"Download", value:("[Android APK](" + $apk + ") · [All downloads](" + $rel + ")")}]}]}')"
          curl -fsS -H "Content-Type: application/json" -d "$payload" "$WEBHOOK" >/dev/null
          echo "Announced $TAG"
